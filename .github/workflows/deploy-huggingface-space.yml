name: Deploy Hermes X to Hugging Face Space

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-huggingface-hermes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hermes X
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret is missing"; exit 1; }

      - name: Validate Space snapshot
        run: |
          set -euo pipefail
          test -d hf-space || { echo "hf-space/ is missing. Import the Hugging Face Space first."; exit 1; }
          test -f hf-space/README.md || { echo "hf-space/README.md is missing. Refusing deployment."; exit 1; }

      - name: Prepare deployment repository
        run: |
          set -euo pipefail
          rm -rf /tmp/hermes-space
          mkdir -p /tmp/hermes-space
          cp -a hf-space/. /tmp/hermes-space/
          rm -f /tmp/hermes-space/IMPORT_SOURCE.txt
          rm -rf /tmp/hermes-space/.git

          cd /tmp/hermes-space
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: Hermes X Space snapshot"

      - name: Push Space snapshot
        working-directory: /tmp/hermes-space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          git remote add huggingface "https://Jishnupg:${HF_TOKEN}@huggingface.co/spaces/Jishnupg/Hermes"
          git push --force huggingface "HEAD:main"
          git remote remove huggingface

      - name: Deployment summary
        run: |
          echo "Deployed hf-space/ snapshot to Jishnupg/Hermes"
          echo "Source commit: $(git rev-parse HEAD)
