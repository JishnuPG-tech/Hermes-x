name: Deploy Hermes X to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - "hf-space/**"
      - ".github/workflows/deploy-huggingface-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-huggingface-hermes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hermes X
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Validate Space snapshot
        run: |
          set -euo pipefail
          test -d hf-space || { echo "hf-space/ is missing. Import the Hugging Face Space first."; exit 1; }
          test -f hf-space/README.md || { echo "hf-space/README.md is missing. Refusing deployment."; exit 1; }
          grep -q '^sdk: docker' hf-space/README.md || { echo "Space README does not declare sdk: docker."; exit 1; }

      - name: Sync Space snapshot to Hugging Face
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Jishnupg/Hermes
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
          subdirectory: hf-space

      - name: Deployment summary
        run: |
          echo "Synced hf-space/ to Hugging Face Space Jishnupg/Hermes"
          echo "Source commit: ${GITHUB_SHA}"
