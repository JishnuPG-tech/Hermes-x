<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Claude Android Home</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Anthropic Serif Typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            anthropic: {
              bg: '#141413',
              card: '#1f1e1c',
              elevated: '#282724',
              pill: '#2d2c29',
              coral: '#d97757',
              text: '#faf9f5',
              subtext: '#94928b',
              muted: '#666560',
              purple: '#b395f7',
              icon: '#c5c3ba'
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    };
  </script>
<style data-purpose="custom-typography-and-scroll">
    /* Global baseline and smoothing */
    body {
      background-color: #141413;
      color: #faf9f5;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Claude greeting font style matches Anthropic custom serif */
    .font-claude-serif {
      font-family: 'Newsreader', Georgia, serif;
      font-feature-settings: "pnum" 1, "onum" 1;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body class="min-h-screen bg-anthropic-bg text-anthropic-text flex flex-col justify-between selection:bg-anthropic-coral/30">
<!-- BEGIN: AndroidStatusBar -->
<!-- Top device status bar replicating Android 14/15 notification line -->
<section class="w-full pt-2.5 px-6 flex justify-between items-center text-[13px] font-medium tracking-tight text-[#e5e5e3] z-50 select-none" data-purpose="android-status-bar">
<!-- Left: Time -->
<div class="flex items-center pl-0.5">
<span class="tracking-normal font-medium text-[13.5px]">12:23</span>
</div>
<!-- Right: Network, 5G, VoLTE and Battery Indicators -->
<div class="flex items-center space-x-1.5 text-white/90">
<!-- Network speed / VoLTE icon -->
<div class="flex flex-col items-center leading-none text-[8.5px] font-semibold tracking-tighter opacity-90 pr-0.5">
<span>1.40</span>
<span class="scale-90 -mt-0.5">MB/S</span>
</div>
<!-- VoLTE text icon -->
<div class="flex flex-col items-center justify-center border border-white/60 rounded-[2px] px-[1.5px] py-[0.5px] leading-none text-[7px] font-bold">
<span>Vo</span>
<span>LTE</span>
</div>
<!-- 5G Signal Bars -->
<div class="flex items-end space-x-[1.5px] h-3 px-0.5">
<span class="text-[9px] font-bold leading-none -mt-1 pr-0.5">5G</span>
<div class="w-[2.5px] h-1.5 bg-white rounded-xs"></div>
<div class="w-[2.5px] h-2 bg-white rounded-xs"></div>
<div class="w-[2.5px] h-2.5 bg-white rounded-xs"></div>
<div class="w-[2.5px] h-3 bg-white rounded-xs"></div>
</div>
<!-- Battery pill percentage & icon -->
<div class="flex items-center space-x-1 pl-1">
<div class="w-5 h-2.5 border border-white/80 rounded-[3px] p-[1px] flex items-center relative">
<div class="h-full bg-white rounded-[1.5px]" style="width: 64%;"></div>
<!-- Battery terminal nub -->
<div class="w-[1.5px] h-1 bg-white/80 absolute -right-[2.5px] top-[2.5px] rounded-r-xs"></div>
</div>
<span class="text-[11.5px] font-medium tracking-tight pl-0.5">64%</span>
</div>
</div>
</section>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: ClaudeTopNavigation -->
<!-- Header with Hamburger icon and Ghost/Incognito icon -->
<header class="w-full px-5 pt-3 pb-2 flex justify-between items-center" data-purpose="top-app-header">
<!-- Drawer Toggle Button -->
<button aria-label="Open menu" class="p-2 -ml-2 rounded-full active:bg-white/5 transition-colors focus:outline-none" type="button">
<svg class="w-6 h-6 text-anthropic-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" viewbox="0 0 24 24">
<line x1="4" x2="20" y1="7" y2="7"></line>
<line x1="4" x2="16" y1="12" y2="12"></line>
<line x1="4" x2="12" y1="17" y2="17"></line>
</svg>
</button>
<!-- Incognito/Ghost chat icon -->
<button aria-label="Ephemeral chat" class="p-2 -mr-2 rounded-full active:bg-white/5 transition-colors focus:outline-none" type="button">
<svg class="w-[25px] h-[25px] text-anthropic-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24">
<!-- Ghost outline -->
<path d="M9 19c-1.5 1.5-3 1-3 1s-1.5-.5-1.5-3V9a7.5 7.5 0 0 1 15 0v8c0 2.5-1.5 3-1.5 3s-1.5.5-3-1c-1-1-2-.5-3 0s-2 1-3-1z"></path>
<!-- Ghost Eyes -->
<circle cx="9.5" cy="9.5" fill="currentColor" r="1.25" stroke="none"></circle>
<circle cx="14.5" cy="9.5" fill="currentColor" r="1.25" stroke="none"></circle>
</svg>
</button>
</header>
<!-- END: ClaudeTopNavigation -->
<!-- BEGIN: HeroGreetingSection -->
<!-- Centered terracotta spark logo and personal greeting -->
<main class="flex-1 flex flex-col items-center justify-center -mt-16 px-6 text-center" data-purpose="greeting-hero">
<!-- Terracotta / Coral 14-point starburst icon -->
<div aria-hidden="true" class="mb-5 animate-fade-in">
<svg class="w-14 h-14 text-anthropic-coral drop-shadow-sm" fill="currentColor" viewbox="0 0 100 100">
<!-- Exact reproduction of Anthropic's geometric sunburst logo -->
<g transform="translate(50,50)">
<!-- Spokes rotated evenly 360/14 = ~25.714 deg -->
<rect height="23" rx="3" transform="rotate(0)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(25.71)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(51.43)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(77.14)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(102.86)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(128.57)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(154.29)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(180)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(205.71)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(231.43)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(257.14)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(282.86)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(308.57)" width="6" x="-3" y="-36"></rect>
<rect height="23" rx="3" transform="rotate(334.29)" width="6" x="-3" y="-36"></rect>
</g>
</svg>
</div>
<!-- Claude greeting headline in serif -->
<h1 class="font-claude-serif text-[32px] sm:text-[34px] leading-tight font-medium text-anthropic-text tracking-tight">
      Good afternoon, Jishnu
    </h1>
</main>
<!-- END: HeroGreetingSection -->
<!-- BEGIN: BottomChatComposer -->
<!-- Docked bottom panel card containing Pro upgrade banner, text input area, and control buttons -->
<section class="w-full px-3.5 pb-2" data-purpose="composer-panel">
<!-- Main elevated container -->
<div class="w-full bg-[#1b1a18] border border-[#282724] rounded-[28px] p-2.5 shadow-2xl flex flex-col space-y-3">
<!-- Top Pro Upgrade Banner -->
<div class="w-full bg-[#272623] hover:bg-[#2c2a27] transition-colors rounded-[20px] px-4 py-3 flex items-center justify-between cursor-pointer" data-purpose="pro-upgrade-banner">
<span class="text-[13.5px] text-[#b8b6af] font-normal tracking-tight">Get more with Claude Pro</span>
<button class="text-[13.5px] text-anthropic-purple font-medium hover:underline focus:outline-none" type="button">
          Upgrade to Pro
        </button>
</div>
<!-- Chat input placeholder field -->
<div class="px-2 pt-2 pb-3" data-purpose="chat-input-area">
<label class="sr-only" for="chat-message-input">Chat with Claude</label>
<div class="flex items-center">
<input autocomplete="off" class="w-full bg-transparent border-0 text-[#f5f4ef] placeholder-[#6e6c64] text-[17px] font-normal p-0 focus:ring-0 focus:outline-none" id="chat-message-input" placeholder="Chat with Claude..." type="text"/>
</div>
</div>
<!-- Bottom action bar: [+] , [Model Pill] , [Mic] , [Audio Mode Button] -->
<div class="flex items-center justify-between pt-0 pb-0.5 px-0.5" data-purpose="composer-action-controls">
<!-- Left group: Add Attachment button & Model Selector Pill -->
<div class="flex items-center space-x-2">
<!-- Add content (+) icon button -->
<button aria-label="Add files or content" class="w-10 h-10 rounded-full bg-[#2a2926] hover:bg-[#34322e] active:scale-95 transition flex items-center justify-center text-anthropic-icon" type="button">
<svg class="w-5 h-5 text-[#dcdad0]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
<!-- Model Selector Chip -->
<button aria-label="Select Model" class="h-10 px-4 rounded-full bg-[#2a2926] hover:bg-[#34322e] active:scale-95 transition flex items-center space-x-1 text-[13.5px] font-medium text-[#e2e0d8]" type="button">
<span>Sonnet 5</span>
<span class="text-[#8e8c84] font-normal ml-0.5">Low</span>
</button>
</div>
<!-- Right group: Voice dictation & Realtime Voice Mode -->
<div class="flex items-center space-x-2">
<!-- Dictation Mic Button -->
<button aria-label="Voice input" class="w-10 h-10 rounded-full bg-[#2a2926] hover:bg-[#34322e] active:scale-95 transition flex items-center justify-center text-[#dcdad0]" type="button">
<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="22"></line>
</svg>
</button>
<!-- Real-time Voice Mode Waveform Button (Filled White circle) -->
<button aria-label="Start interactive voice mode" class="w-10 h-10 rounded-full bg-white hover:bg-neutral-200 active:scale-95 transition-transform flex items-center justify-center shadow-md" type="button">
<!-- Waveform icon (5 vertical bars) -->
<svg class="w-5 h-5 text-black" fill="currentColor" viewbox="0 0 24 24">
<rect height="6" rx="1" width="2" x="4" y="9"></rect>
<rect height="12" rx="1" width="2" x="8" y="6"></rect>
<rect height="16" rx="1" width="2" x="12" y="4"></rect>
<rect height="10" rx="1" width="2" x="16" y="7"></rect>
<rect height="4" rx="1" width="2" x="20" y="10"></rect>
</svg>
</button>
</div>
</div>
</div>
</section>
<!-- END: BottomChatComposer -->
<!-- BEGIN: AndroidNavigationBar -->
<!-- 3-Button Android Navigation Bar (Recents, Home, Back) -->
<footer class="w-full py-2.5 px-10 flex justify-around items-center select-none text-neutral-500" data-purpose="android-system-navigation">
<!-- Menu / App Switcher (3 horizontal lines) -->
<button aria-label="Recent apps" class="p-2 active:opacity-50" type="button">
<svg class="w-[17px] h-[17px] stroke-current" fill="none" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24">
<line x1="5" x2="19" y1="7" y2="7"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
<line x1="5" x2="19" y1="17" y2="17"></line>
</svg>
</button>
<!-- Home (Square outline) -->
<button aria-label="Home" class="p-2 active:opacity-50" type="button">
<div class="w-[14px] h-[14px] border-[1.8px] border-neutral-500 rounded-[3px]"></div>
</button>
<!-- Back (Left chevron / triangle) -->
<button aria-label="Back" class="p-2 active:opacity-50" type="button">
<svg class="w-[15px] h-[15px] stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
</button>
</footer>
<!-- END: AndroidNavigationBar -->
</body></html>
