<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Hermes - Add to Chat</title>
<!-- Tailwind CSS CDN v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<!-- Google Fonts: Inter and Newsreader / Serif for Claude's greeting -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-typography">
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-serif-claude {
      font-family: 'Newsreader', serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
  </style>
<style data-purpose="toggle-styling">
    /* Styled Android / Material style switch */
    .switch-checkbox:checked + .switch-track {
      background-color: #3892e5;
    }
    .switch-checkbox:checked + .switch-track .switch-thumb {
      transform: translateX(20px);
    }
  </style>
</head>
<body class="bg-[#101010] text-[#ececee] flex justify-center items-center min-h-screen p-0 m-0 select-none overflow-hidden">
<!-- BEGIN: PhoneFrameWrapper -->
<!-- Container scaled to mobile device proportions (approx 9:20 ratio) -->
<main class="relative w-full max-w-[430px] h-[100dvh] max-h-[932px] bg-[#121212] overflow-hidden flex flex-col justify-between shadow-2xl">
<!-- BEGIN: AndroidStatusBar -->
<header class="flex justify-between items-center px-6 pt-3 pb-1 text-xs text-[#cfd3d8] z-10 shrink-0 font-medium tracking-tight">
<span class="text-sm font-semibold text-[#e1e3e7]">12:23</span>
<div class="flex items-center space-x-2 text-[11px] opacity-90">
<span class="text-[10px] leading-tight font-mono tracking-tighter">20.0<br/>KB/S</span>
<span class="text-[10px] font-bold tracking-tight">Vo<br/>LTE</span>
<span class="text-xs font-semibold ml-0.5">5G</span>
<!-- Cellular bars -->
<span class="material-symbols-outlined text-[15px] -rotate-90">signal_cellular_alt</span>
<!-- Battery status -->
<div class="flex items-center gap-1">
<div class="w-5 h-2.5 border border-[#c4c7c5] rounded-[3px] p-[1.5px] flex items-center relative">
<div class="h-full bg-[#c4c7c5] w-[63%] rounded-[1px]"></div>
</div>
<span class="text-[11px] font-normal">63%</span>
</div>
</div>
</header>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: AppHeader -->
<nav class="flex justify-between items-center px-5 py-2.5 z-10 shrink-0">
<!-- Menu Drawer button -->
<button aria-label="Menu" class="text-[#c4c7c5] active:opacity-70 p-1" type="button">
<svg class="w-6 h-6 stroke-[1.75]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3.75 6.75h16.5M3.75 12h11.5M3.75 17.25h16.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Claude avatar icon (character/ghost icon top right) -->
<button aria-label="Profile or character" class="text-[#c4c7c5] active:opacity-70 p-1" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24">
<!-- Stylized scalloped Claude ghost/avatar -->
<path d="M12 3c-4.4 0-8 3.6-8 8v7c0 .6.4 1 1 1h.5c.6 0 1-.4 1-1v-.5c0-.6.4-1 1-1s1 .4 1 1v.5c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-.5c0-.6.4-1 1-1s1 .4 1 1v.5c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-.5c0-.6.4-1 1-1s1 .4 1 1v.5c0 .6.4 1 1 1h.5c.6 0 1-.4 1-1v-7c0-4.4-3.6-8-8-8z"></path>
<circle cx="9.5" cy="11.5" fill="currentColor" r="1.2"></circle>
<circle cx="14.5" cy="11.5" fill="currentColor" r="1.2"></circle>
</svg>
</button>
</nav>
<!-- END: AppHeader -->
<!-- BEGIN: MainBackgroundContent -->
<!-- Contains the inline system-event card and greeting peeking behind sheet -->
<div class="flex-1 px-4 pt-1 flex flex-col items-center select-none relative overflow-hidden">
<!-- Voice chat ended Notification Card -->
<article class="w-full bg-[#1e1e1e] border border-[#2b2a28] rounded-[22px] px-4 py-3 flex items-center justify-between text-white shadow-lg" data-purpose="voice-chat-card">
<!-- Left waveform & text -->
<div class="flex items-center space-x-3.5">
<!-- Waveform icon -->
<div class="text-[#b2aba0] flex items-center justify-center">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">
<path d="M12 3a1 1 0 0 0-1 1v16a1 1 0 1 0 2 0V4a1 1 0 0 0-1-1zm-4 4a1 1 0 0 0-1 1v8a1 1 0 1 0 2 0V8a1 1 0 0 0-1-1zm8 2a1 1 0 0 0-1 1v4a1 1 0 1 0 2 0v-4a1 1 0 0 0-1-1zm-12 3a1 1 0 0 0-1 1v2a1 1 0 1 0 2 0v-2a1 1 0 0 0-1-1z"></path>
</svg>
</div>
<div>
<h2 class="text-[15px] font-semibold tracking-tight text-[#f1ede8] leading-tight">Voice chat ended</h2>
<span class="text-[13px] text-[#938e86] font-normal leading-tight">2s</span>
</div>
</div>
<!-- Center feedback thumbs & close button -->
<div class="flex items-center">
<div class="flex items-center space-x-4 pr-4 text-[#ded7ce]">
<!-- Thumbs up -->
<button aria-label="Thumbs up" class="hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">thumb_up</span>
</button>
<!-- Thumbs down -->
<button aria-label="Thumbs down" class="hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">thumb_down</span>
</button>
</div>
<!-- Vertical hairline divider -->
<div class="h-8 w-[1px] bg-[#33312e] mr-3"></div>
<!-- Close / dismiss icon -->
<button aria-label="Dismiss banner" class="text-[#cfc7be] hover:text-white" type="button">
<span class="material-symbols-outlined text-[21px]">close</span>
</button>
</div>
</article>
<!-- Center Greeting: Orange Starburst Logo & Good afternoon -->
<section class="flex flex-col items-center justify-center mt-28 text-center" data-purpose="chat-welcome-greeting">
<!-- Claude Terra Cotta Starburst Logo -->
<div class="text-[#cc785c] mb-6">
<svg class="w-14 h-14 fill-current" viewbox="0 0 100 100">
<!-- 16-ray rounded starburst representing Claude mark -->
<path d="M50 0 L53 38 L85 15 L62 46 L98 50 L62 54 L85 85 L53 62 L50 100 L47 62 L15 85 L38 54 L2 50 L38 46 L15 15 L47 38 Z"></path>
</svg>
</div>
<!-- Greeting text -->
<h1 class="font-serif-claude text-[31px] text-[#ece6dc] font-normal tracking-wide">
          Good afternoon, Jishnu
        </h1>
</section>
<!-- Dark backdrop scrim overlay covering background elements -->
<div class="absolute inset-0 bg-black/40 pointer-events-none z-20"></div>
</div>
<!-- END: MainBackgroundContent -->
<!-- BEGIN: BottomSheetModal -->
<div class="relative z-30 bg-[#191919] border-t border-[#292825] rounded-t-[32px] pt-2 px-4 pb-2 shadow-2xl flex flex-col" data-purpose="add-to-chat-sheet">
<!-- Drag handle -->
<div class="flex justify-center w-full py-1.5 cursor-grab">
<div class="w-12 h-[4px] bg-[#423f3b] rounded-full"></div>
</div>
<!-- Header: Close button & Centered Title -->
<div class="relative flex items-center justify-center pt-2 pb-5">
<button aria-label="Close add menu" class="absolute left-1 text-[#f3ede4] p-1 active:opacity-70" type="button">
<span class="material-symbols-outlined text-[23px]">close</span>
</button>
<h2 class="text-[17px] font-semibold text-[#f5f2ed] tracking-tight">Add to chat</h2>
</div>
<!-- Action items 3-up Grid (Camera, Photos, Files) -->
<div class="grid grid-cols-3 gap-3 mb-5">
<!-- Camera Button Card -->
<button class="flex flex-col items-center justify-center bg-[#232321] active:bg-[#2c2b29] rounded-[20px] py-4 h-[116px] transition-colors border border-transparent hover:border-[#383733]" type="button">
<div class="w-12 h-12 rounded-full bg-[#30302c] flex items-center justify-center text-[#eae6e0] mb-2">
<span class="material-symbols-outlined text-[24px]">photo_camera</span>
</div>
<span class="text-[15px] font-medium text-[#f1ede6]">Camera</span>
</button>
<!-- Photos Button Card -->
<button class="flex flex-col items-center justify-center bg-[#232321] active:bg-[#2c2b29] rounded-[20px] py-4 h-[116px] transition-colors border border-transparent hover:border-[#383733]" type="button">
<div class="w-12 h-12 rounded-full bg-[#30302c] flex items-center justify-center text-[#eae6e0] mb-2">
<span class="material-symbols-outlined text-[24px]">image</span>
</div>
<span class="text-[15px] font-medium text-[#f1ede6]">Photos</span>
</button>
<!-- Files Button Card -->
<button class="flex flex-col items-center justify-center bg-[#232321] active:bg-[#2c2b29] rounded-[20px] py-4 h-[116px] transition-colors border border-transparent hover:border-[#383733]" type="button">
<div class="w-12 h-12 rounded-full bg-[#30302c] flex items-center justify-center text-[#eae6e0] mb-2">
<span class="material-symbols-outlined text-[24px]">upload_file</span>
</div>
<span class="text-[15px] font-medium text-[#f1ede6]">Files</span>
</button>
</div>
<!-- Grouped Toggle List Section -->
<div class="bg-[#232321] rounded-[22px] overflow-hidden divide-y divide-[#2e2d2a] mb-2">
<!-- Web search Row -->
<label class="flex items-center justify-between px-4 py-3.5 cursor-pointer active:bg-[#2a2926]">
<div class="flex items-center space-x-3.5">
<div class="w-10 h-10 rounded-full bg-[#32312d] flex items-center justify-center text-[#dcd7ce]">
<span class="material-symbols-outlined text-[22px]">public</span>
</div>
<span class="text-[16px] font-medium text-[#f2eee7]">Web search</span>
</div>
<!-- Toggle switch (Default ON) -->
<div class="relative inline-flex items-center">
<input checked="" class="sr-only switch-checkbox" type="checkbox"/>
<div class="switch-track w-[48px] h-[28px] bg-[#3e3c38] rounded-full p-1 transition-colors duration-200 ease-in-out">
<div class="switch-thumb w-[20px] h-[20px] bg-white rounded-full transition-transform duration-200 ease-in-out shadow-sm"></div>
</div>
</div>
</label>
<!-- Memory Row -->
<label class="flex items-center justify-between px-4 py-3.5 cursor-pointer active:bg-[#2a2926]">
<div class="flex items-center space-x-3.5">
<div class="w-10 h-10 rounded-full bg-[#32312d] flex items-center justify-center text-[#dcd7ce]">
<span class="material-symbols-outlined text-[22px]">history</span>
</div>
<span class="text-[16px] font-medium text-[#f2eee7]">Memory</span>
</div>
<!-- Toggle switch (Default ON) -->
<div class="relative inline-flex items-center">
<input checked="" class="sr-only switch-checkbox" type="checkbox"/>
<div class="switch-track w-[48px] h-[28px] bg-[#3e3c38] rounded-full p-1 transition-colors duration-200 ease-in-out">
<div class="switch-thumb w-[20px] h-[20px] bg-white rounded-full transition-transform duration-200 ease-in-out shadow-sm"></div>
</div>
</div>
</label>
</div>
<!-- Add to project (Peeking partially at the bottom) -->
<div class="bg-[#232321] rounded-t-[22px] px-4 py-3.5 flex items-center justify-between opacity-80 overflow-hidden h-14">
<div class="flex items-center space-x-3.5">
<div class="w-10 h-10 rounded-full bg-[#32312d] flex items-center justify-center text-[#dcd7ce]">
<span class="material-symbols-outlined text-[22px]">folder</span>
</div>
<div class="flex flex-col">
<span class="text-[16px] font-medium text-[#f2eee7] leading-tight">Add to project</span>
<span class="text-[13px] text-[#9a948c] leading-tight">None</span>
</div>
</div>
</div>
</div>
<!-- END: BottomSheetModal -->
<!-- BEGIN: AndroidNavigationBar -->
<footer class="h-10 bg-[#191919] w-full flex items-center justify-around px-16 text-[#6d6b67] shrink-0 z-40 select-none pb-1">
<!-- Recent apps icon (three vertical lines/hamburger style) -->
<button aria-label="Recent apps" class="p-2" type="button">
<svg class="w-4 h-4 fill-current stroke-current" viewbox="0 0 24 24">
<path d="M6 5h2v14H6zm5 0h2v14h-2zm5 0h2v14h-2z"></path>
</svg>
</button>
<!-- Home bar / button -->
<button aria-label="Home" class="p-2" type="button">
<div class="w-3.5 h-3.5 border-2 border-current rounded-[3px]"></div>
</button>
<!-- Back button (triangle pointing left) -->
<button aria-label="Back" class="p-2" type="button">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<polygon points="17,5 7,12 17,19"></polygon>
</svg>
</button>
</footer>
<!-- END: AndroidNavigationBar -->
</main>
<!-- END: PhoneFrameWrapper -->
</body></html>
