<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>Claude Voice Mode</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Serif Typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#141413',
              terracotta: '#D97757',
              pill: '#272624',
              btn: '#201F1D',
              activeMic: '#1E4620',
              textPrimary: '#FAF9F5',
              textMuted: '#96948F'
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
<style data-purpose="custom-layout">
    /* Prevent default text highlighting and elastic scroll */
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #141413;
    }

    /* Ambient faint lower vignette/illumination identical to Claude UI */
    .ambient-glow {
      background: radial-gradient(circle 500px at 50% 105%, rgba(35, 42, 54, 0.45) 0%, rgba(20, 20, 19, 0) 80%);
    }

    /* Subtle pulse animation for connecting starburst */
    @keyframes subtle-breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    .pulse-connecting {
      animation: subtle-breathe 2.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden text-brand-textPrimary font-sans bg-brand-bg flex flex-col justify-between select-none relative ambient-glow">
<!-- BEGIN: AndroidStatusBar -->
<header class="w-full pt-3 px-6 pb-2 flex items-center justify-between text-xs z-20 font-medium tracking-tight" data-purpose="status-bar">
<!-- Clock Display -->
<div class="text-[13px] font-medium tracking-normal text-[#E1E0DC] pl-1" id="status-time">
      12:23
    </div>
<!-- Active Android Microphone Indicator -->
<div class="flex items-center space-x-2">
<div class="bg-[#2EB850] rounded-full h-5 w-5 flex items-center justify-center shadow-sm">
<svg class="w-3 h-3 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
<path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
</svg>
</div>
</div>
</header>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: TopBarAction -->
<div class="w-full flex justify-end px-5 pt-1" data-purpose="action-header">
<!-- Settings Circular Button -->
<button aria-label="Settings" class="w-12 h-12 rounded-full bg-brand-btn/85 hover:bg-brand-pill active:scale-95 transition-all flex items-center justify-center text-brand-textMuted hover:text-brand-textPrimary border border-white/[0.04]" type="button">
<svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
<!-- END: TopBarAction -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col items-center justify-center -mt-16 px-6" data-purpose="connecting-feedback">
<!-- Starburst Claude Spark Logo Mark -->
<div class="pulse-connecting flex items-center justify-center mb-6" data-purpose="claude-sparkle-logo">
<svg class="w-9 h-9 text-brand-terracotta fill-current" viewbox="0 0 24 24">
<!-- 16-ray rounded asterism / sunburst Claude symbol -->
<g transform="translate(12,12)">
<path d="M-1.1 -11 C-1.1 -11.6 -0.6 -12 0 -12 C0.6 -12 1.1 -11.6 1.1 -11 L1.1 -5.2 C1.1 -4.6 0.6 -4.1 0 -4.1 C-0.6 -4.1 -1.1 -4.6 -1.1 -5.2 Z"></path>
<path d="M-1.1 5.2 C-1.1 4.6 -0.6 4.1 0 4.1 C0.6 4.1 1.1 4.6 1.1 5.2 L1.1 11 C1.1 11.6 0.6 12 0 12 C-0.6 12 -1.1 11.6 -1.1 11 Z"></path>
<path d="M-11 -1.1 C-11.6 -1.1 -12 -0.6 -12 0 C-12 0.6 -11.6 1.1 -11 1.1 L-5.2 1.1 C-4.6 1.1 -4.1 0.6 -4.1 0 C-4.1 -0.6 -4.6 -1.1 -5.2 -1.1 Z"></path>
<path d="M5.2 -1.1 C4.6 -1.1 4.1 -0.6 4.1 0 C4.1 0.6 4.6 1.1 5.2 1.1 L11 1.1 C11.6 1.1 12 0.6 12 0 C12 -0.6 11.6 -1.1 11 -1.1 Z"></path>
<path d="M-1.1 -11 C-1.1 -11.6 -0.6 -12 0 -12 C0.6 -12 1.1 -11.6 1.1 -11 L1.1 -5.2 C1.1 -4.6 0.6 -4.1 0 -4.1 C-0.6 -4.1 -1.1 -4.6 -1.1 -5.2 Z" transform="rotate(22.5)"></path>
<path d="M-1.1 5.2 C-1.1 4.6 -0.6 4.1 0 4.1 C0.6 4.1 1.1 4.6 1.1 5.2 L1.1 11 C1.1 11.6 0.6 12 0 12 C-0.6 12 -1.1 11.6 -1.1 11 Z" transform="rotate(22.5)"></path>
<path d="M-1.1 -11 C-1.1 -11.6 -0.6 -12 0 -12 C0.6 -12 1.1 -11.6 1.1 -11 L1.1 -5.2 C1.1 -4.6 0.6 -4.1 0 -4.1 C-0.6 -4.1 -1.1 -4.6 -1.1 -5.2 Z" transform="rotate(45)"></path>
<path d="M-1.1 5.2 C-1.1 4.6 -0.6 4.1 0 4.1 C0.6 4.1 1.1 4.6 1.1 5.2 L1.1 11 C1.1 11.6 0.6 12 0 12 C-0.6 12 -1.1 11.6 -1.1 11 Z" transform="rotate(45)"></path>
<path d="M-1.1 -11 C-1.1 -11.6 -0.6 -12 0 -12 C0.6 -12 1.1 -11.6 1.1 -11 L1.1 -5.2 C1.1 -4.6 0.6 -4.1 0 -4.1 C-0.6 -4.1 -1.1 -4.6 -1.1 -5.2 Z" transform="rotate(67.5)"></path>
<path d="M-1.1 5.2 C-1.1 4.6 -0.6 4.1 0 4.1 C0.6 4.1 1.1 4.6 1.1 5.2 L1.1 11 C1.1 11.6 0.6 12 0 12 C-0.6 12 -1.1 11.6 -1.1 11 Z" transform="rotate(67.5)"></path>
<path d="M-1.1 -11 C-1.1 -11.6 -0.6 -12 0 -12 C0.6 -12 1.1 -11.6 1.1 -11 L1.1 -5.2 C1.1 -4.6 0.6 -4.1 0 -4.1 C-0.6 -4.1 -1.1 -4.6 -1.1 -5.2 Z" transform="rotate(112.5)"></path>
<path d="M-1.1 5.2 C-1.1 4.6 -0.6 4.1 0 4.1 C0.6 4.1 1.1 4.6 1.1 5.2 L1.1 11 C1.1 11.6 0.6 12 0 12 C-0.6 12 -1.1 11.6 -1.1 11 Z" transform="rotate(112.5)"></path>
<path d="M-1.1 -11 C-1.1 -11.6 -0.6 -12 0 -12 C0.6 -12 1.1 -11.6 1.1 -11 L1.1 -5.2 C1.1 -4.6 0.6 -4.1 0 -4.1 C-0.6 -4.1 -1.1 -4.6 -1.1 -5.2 Z" transform="rotate(135)"></path>
<path d="M-1.1 5.2 C-1.1 4.6 -0.6 4.1 0 4.1 C0.6 4.1 1.1 4.6 1.1 5.2 L1.1 11 C1.1 11.6 0.6 12 0 12 C-0.6 12 -1.1 11.6 -1.1 11 Z" transform="rotate(135)"></path>
<path d="M-1.1 -11 C-1.1 -11.6 -0.6 -12 0 -12 C0.6 -12 1.1 -11.6 1.1 -11 L1.1 -5.2 C1.1 -4.6 0.6 -4.1 0 -4.1 C-0.6 -4.1 -1.1 -4.6 -1.1 -5.2 Z" transform="rotate(157.5)"></path>
<path d="M-1.1 5.2 C-1.1 4.6 -0.6 4.1 0 4.1 C0.6 4.1 1.1 4.6 1.1 5.2 L1.1 11 C1.1 11.6 0.6 12 0 12 C-0.6 12 -1.1 11.6 -1.1 11 Z" transform="rotate(157.5)"></path>
</g>
</svg>
</div>
<!-- Serif Connecting Text -->
<h1 class="font-serif text-[27px] font-normal tracking-[-0.01em] text-brand-textPrimary select-none text-center">
      Hold tight, connecting…
    </h1>
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomControlHUD -->
<footer class="w-full pb-3 flex flex-col items-center z-20" data-purpose="hud-controls">
<!-- Elevated Microphone Centered Above Controls -->
<div class="mb-4 flex justify-center">
<button aria-label="Toggle Microphone" class="w-[66px] h-[66px] rounded-full bg-[#1C1B19]/90 border border-white/[0.06] flex items-center justify-center text-[#B5B3AD] active:scale-95 transition-all shadow-lg hover:text-white" type="button">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="22"></line>
</svg>
</button>
</div>
<!-- Bottom Horizontal Bar: [Add Context] [Model Switcher Pill] [End Call] -->
<div class="w-full px-6 flex items-center justify-between">
<!-- Add Context (+) Button -->
<button aria-label="Add" class="w-13 h-13 w-[52px] h-[52px] rounded-full bg-[#1F1E1C] border border-white/[0.05] flex items-center justify-center text-brand-textPrimary active:scale-95 transition-all" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
<!-- Model Switcher Selector Pill -->
<button aria-label="Select Model" class="h-[48px] px-5 rounded-full bg-[#201F1D] border border-white/[0.06] flex items-center justify-center space-x-1.5 active:bg-[#282724] transition-all" type="button">
<span class="text-[15px] font-medium text-brand-textPrimary">Sonnet</span>
<!-- Dual Vertical Chevron -->
<svg class="w-3.5 h-3.5 text-brand-textMuted ml-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="7 9 12 4 17 9"></polyline>
<polyline points="7 15 12 20 17 15"></polyline>
</svg>
</button>
<!-- Hang Up / Dismiss White Circular Button -->
<button aria-label="End Call" class="w-[52px] h-[52px] rounded-full bg-white flex items-center justify-center text-black active:scale-95 transition-all shadow-md" type="button">
<svg class="w-6 h-6 stroke-[2.4]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
</div>
<!-- BEGIN: AndroidVirtualNavigation -->
<div class="w-full pt-6 pb-2 px-12 flex items-center justify-between opacity-35 text-white" data-purpose="android-nav-bar">
<!-- Recent Apps (3 vertical lines) -->
<div class="w-5 h-5 flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<line x1="6" x2="6" y1="6" y2="18"></line>
<line x1="12" x2="12" y1="6" y2="18"></line>
<line x1="18" x2="18" y1="6" y2="18"></line>
</svg>
</div>
<!-- Home Button (Square outline) -->
<div class="w-5 h-5 flex items-center justify-center">
<div class="w-3.5 h-3.5 border-2 border-current rounded-[3px]"></div>
</div>
<!-- Back Button (Triangle pointing left) -->
<div class="w-5 h-5 flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M16 6 L8 12 L16 18 Z" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- END: AndroidVirtualNavigation -->
</footer>
<!-- END: BottomControlHUD -->
</body></html>
