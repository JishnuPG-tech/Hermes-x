<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Hermes Android Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-typography">
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap');
    .font-serif-brand {
      font-family: 'Instrument Serif', Georgia, serif;
    }
    .font-sans-ui {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-[#141413] text-[#faf9f5] font-sans-ui antialiased min-h-screen flex justify-center items-center p-0 m-0 select-none">
<!-- BEGIN: MobileFrame -->
<main class="w-full max-w-[420px] h-[890px] max-h-screen bg-[#141413] flex flex-col justify-between relative px-6 overflow-hidden shadow-2xl">
<!-- BEGIN: AndroidStatusBar -->
<header class="w-full pt-3 pb-2 flex items-center justify-between text-xs text-[#8e8b82] tracking-normal z-20">
<!-- Left: Time and notification mark -->
<div class="flex items-center space-x-1.5 pl-1">
<span class="text-white text-[13px] font-medium tracking-tight">9:45</span>
<svg class="w-3.5 h-3.5 text-[#8e8b82]" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Right: Network, VoLTE, 5G, Battery indicators -->
<div class="flex items-center space-x-2 text-[10px] text-[#b0aea5] pr-1">
<div class="flex flex-col text-[8px] leading-[9px] text-right font-mono text-[#8e8b82]">
<span>9.00</span>
<span>KB/S</span>
</div>
<div class="border border-[#8e8b82] text-[8px] px-0.5 rounded leading-tight">VoLTE</div>
<div class="flex items-center text-[10px] font-semibold tracking-tighter">
<span>5G</span>
<svg class="w-3 h-3 ml-0.5" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.25 19h15.5l-.72-1.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.5-.47 2.88-1.28 4.03H6.28C5.47 14.88 5 13.5 5 12c0-3.87 3.13-7 7-7z"></path>
</svg>
</div>
<div class="flex items-center space-x-1">
<span class="text-[11px] font-normal text-white">36%</span>
<div class="w-5 h-2.5 border border-[#8e8b82] rounded-sm p-[1px] flex items-center">
<div class="bg-white h-full w-[36%] rounded-[1px]"></div>
</div>
</div>
</div>
</header>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: BrandHeader -->
<section class="w-full flex items-center justify-center space-x-2.5 pt-2 pb-1" data-purpose="app-branding">
<div class="w-7 h-7 flex items-center justify-center">
<img alt="Hermes Agent" class="w-7 h-7 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDoaYXxd3TgZwilrwAnH6OeSe-NOQD0RzTt_jrTbDRFoAl6LRQx90OByThiOxfW52xuMkudRWbwEvjGpZFJI9BcpHgz2ChkcIPqwFb8wU8tAFzO9EYHxyfYjx4rVUrBfDCFZe8w2AvFi99zVPstypGo6J76uQOXH13iWBbBAWpVygxUObCNgQ1hk-WVgvFmHB13I65IZM7q-j-uDJJm1scd6OSXuiCRiZXJo1Grqa5SR6O1f_SAg9FvHQ"/>
</div>
<h1 class="text-3xl font-serif-brand tracking-normal text-[#faf9f5]">Hermes</h1>
</section>
<!-- END: BrandHeader -->
<!-- BEGIN: CoreGraphicAndHeadline -->
<section class="flex flex-col items-center justify-center my-auto px-2" data-purpose="hero-section">
<!-- Neural Thought Illustration -->
<div class="w-48 h-48 relative flex items-center justify-center mb-6">
<svg class="w-full h-full overflow-visible" viewbox="0 0 200 200">
<!-- White continuous thinking ribbon line -->
<path d="M 45 120 C 45 105, 55 105, 55 120 C 55 135, 65 135, 65 120 C 65 105, 75 105, 75 120 C 75 135, 85 135, 85 120 C 85 95, 95 95, 95 125 C 95 155, 110 165, 130 155 C 150 145, 155 110, 140 85 C 130 70, 140 45, 155 45" fill="none" stroke="#faf9f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"></path>
<!-- Terracotta neural branch interconnects -->
<line stroke="#c96442" stroke-linecap="round" stroke-width="3" x1="95" x2="100" y1="45" y2="100"></line>
<line stroke="#c96442" stroke-linecap="round" stroke-width="3" x1="100" x2="70" y1="100" y2="85"></line>
<line stroke="#c96442" stroke-linecap="round" stroke-width="3" x1="70" x2="65" y1="85" y2="115"></line>
<line stroke="#c96442" stroke-linecap="round" stroke-width="3" x1="100" x2="150" y1="100" y2="80"></line>
<line stroke="#c96442" stroke-linecap="round" stroke-width="3" x1="100" x2="98" y1="100" y2="135"></line>
<line stroke="#c96442" stroke-linecap="round" stroke-width="3" x1="70" x2="115" y1="85" y2="128"></line>
<!-- Terracotta neural node circles -->
<circle cx="95" cy="45" fill="#c96442" r="7"></circle>
<circle cx="70" cy="85" fill="#c96442" r="7.5"></circle>
<circle cx="65" cy="115" fill="#c96442" r="6"></circle>
<circle cx="100" cy="100" fill="#c96442" r="8.5"></circle>
<circle cx="150" cy="80" fill="#c96442" r="7"></circle>
<circle cx="98" cy="135" fill="#c96442" r="6.5"></circle>
<circle cx="115" cy="128" fill="#c96442" r="6"></circle>
</svg>
</div>
<!-- Headline -->
<h2 class="text-[32px] leading-[1.22] font-serif-brand text-center text-[#faf9f5] font-normal tracking-wide max-w-[280px]">
        The AI for problem solvers
      </h2>
</section>
<!-- END: CoreGraphicAndHeadline -->
<!-- BEGIN: AuthenticationActions -->
<section class="w-full flex flex-col items-center space-y-4 pb-2" data-purpose="auth-options">
<!-- Continue with Google Button -->
<button class="w-full h-[52px] bg-white hover:bg-neutral-100 text-[#141413] rounded-full flex items-center justify-center space-x-3 transition-colors shadow-sm active:scale-[0.99]">
<!-- Google G logo -->
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="text-[16px] font-medium tracking-tight">Continue with Google</span>
</button>
<!-- OR Divider -->
<div class="w-full flex items-center justify-between py-0.5">
<div class="flex-grow h-[1px] bg-[#2a2927]"></div>
<span class="px-4 text-[13px] tracking-widest text-[#727068] font-medium">OR</span>
<div class="flex-grow h-[1px] bg-[#2a2927]"></div>
</div>
<!-- Email Input Button -->
<button class="w-full h-[52px] bg-[#242321] border border-[#302f2c] hover:border-[#42413d] text-[#8e8b82] rounded-full flex items-center justify-center text-[16px] font-normal transition-all active:scale-[0.99]">
        Enter your email
      </button>
<!-- Legal Disclaimer -->
<p class="text-[13px] leading-[1.4] text-center text-[#b0aea5] px-2 pt-1 font-normal">
        By continuing, you agree to Hermes's <a class="underline underline-offset-2 text-[#faf9f5] hover:text-white" href="#">Consumer Terms</a> and <a class="underline underline-offset-2 text-[#faf9f5] hover:text-white" href="#">Usage Policy</a>, and acknowledge their <a class="underline underline-offset-2 text-[#faf9f5] hover:text-white" href="#">Privacy Policy</a>.
      </p>
</section>
<!-- END: AuthenticationActions -->
<!-- BEGIN: AndroidNavigationBar -->
<nav aria-label="System Navigation" class="w-full h-11 flex items-center justify-around text-[#706e68] pb-1 pt-1">
<!-- Recents button (Three vertical bars) -->
<button aria-label="Recent apps" class="p-2 active:opacity-50">
<svg class="w-4 h-4 stroke-current fill-none stroke-[2]" viewbox="0 0 24 24">
<line x1="7" x2="7" y1="5" y2="19"></line>
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="17" x2="17" y1="5" y2="19"></line>
</svg>
</button>
<!-- Home button (Rounded square) -->
<button aria-label="Home" class="p-2 active:opacity-50">
<div class="w-3.5 h-3.5 rounded-[4px] border-[2px] border-current"></div>
</button>
<!-- Back button (Chevron left) -->
<button aria-label="Back" class="p-2 active:opacity-50">
<svg class="w-4 h-4 stroke-current fill-none stroke-[2]" viewbox="0 0 24 24">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
</button>
</nav>
<!-- END: AndroidNavigationBar -->
</main>
<!-- END: MobileFrame -->
</body></html>
